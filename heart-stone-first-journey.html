<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HEART STONE — First Journey Prototype</title><style>
:root{font-family:system-ui,sans-serif;color:#23322c;background:#f6f3e9}*{box-sizing:border-box}body{margin:0}main{max-width:760px;margin:auto;padding:24px 18px 70px}header{background:#173f38;color:white;padding:22px max(18px,calc((100vw - 760px)/2));}h1{font-size:1.8rem;margin:5px 0}h2{font-size:1.45rem}p{line-height:1.55}.eyebrow{letter-spacing:.12em;text-transform:uppercase;font-size:.74rem}.card{background:white;border:1px solid #d8dfd7;border-radius:16px;padding:20px;margin:16px 0;box-shadow:0 3px 12px #173f380b}.row{display:flex;gap:9px;flex-wrap:wrap;margin-top:12px}button{border:1px solid #426c5d;border-radius:9px;background:white;color:#173f38;font:inherit;padding:10px 14px;cursor:pointer}button.primary,.selected{background:#176251;color:white}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #e6a948;outline-offset:2px}input,textarea{font:inherit;padding:11px;border:1px solid #899e92;border-radius:8px;width:100%;margin:7px 0 15px}label{display:block;font-weight:600}.muted{color:#53675d;font-size:.9rem}.tag{display:inline-block;background:#e7f0e8;padding:5px 9px;border-radius:8px;margin:3px}.progress{font-weight:600;color:#176251}#notice{min-height:24px}small{font-size:.83rem}
</style><header><div class="eyebrow">DATE QUEST™ · WORLD QUEST™</div><h1>HEART STONE™</h1><div>The hunt for memories starts with you.</div></header><main><p class="muted">Interactive first journey prototype · Your answers stay in this browser. No account, location tracking, or server connection.</p><div id="notice" role="status" aria-live="polite"></div><div id="app"></div></main><script>
const KEY='heart-stone-first-journey-v1';const interests=['Bookstores','Walks','Restaurants','Local history','Nature','Road trips','Paranormal stories','Volunteering'];const adventures=[{title:'A story around the corner',description:'Visit a bookstore or library and find one story worth talking about.',tags:['Bookstores','Local history'],time:'30–60 minutes',cost:'Free unless you choose to buy something',memory:'Save one detail that surprised you.',minutes:60,walking:false,free:false},{title:'A nearby discovery',description:'Take an easy walk and notice a place you have passed before.',tags:['Walks','Nature'],time:'20–45 minutes',cost:'Free',memory:'Save a photo or note about what you noticed.',minutes:45,walking:true,free:true},{title:'A place with a story',description:'Explore a public landmark or local exhibit and learn one thing about it.',tags:['Local history','Paranormal stories'],time:'45–90 minutes',cost:'Check entry cost before going',memory:'Write down the story you want to remember.',minutes:90,walking:true,free:false},{title:'A new flavor',description:'Explore a restaurant or market and discover something distinctive about it.',tags:['Restaurants'],time:'45–90 minutes',cost:'Purchase optional unless venue entry requires it',memory:'Capture a note about the people or place.',minutes:90,walking:false,free:false},{title:'The scenic route',description:'Choose a short public route with a couple of interesting stops.',tags:['Road trips','Nature'],time:'1–2 hours',cost:'Travel cost varies',memory:'Remember your favorite stop.',minutes:120,walking:false,free:false},{title:'A community moment',description:'Find an independently organized volunteer opportunity and decide whether to participate.',tags:['Volunteering'],time:'Varies by organizer',cost:'No donation required',memory:'Save what the experience meant to you.',minutes:120,walking:false,free:true}];
let state;try{state=JSON.parse(localStorage.getItem(KEY))||{}}catch{state={}};state={step:'welcome',name:'',likes:{},limits:{walking:false,freeOnly:false,maxMinutes:120},page:0,choice:null,memory:'',reflection:'',...state};state.limits={walking:false,freeOnly:false,maxMinutes:120,...state.limits};const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function save(message){localStorage.setItem(KEY,JSON.stringify(state));if(message)$('#notice').textContent=message}function go(step){state.step=step;save();render();scrollTo(0,0)}function button(label,fn,primary=false){const b=document.createElement('button');b.textContent=label;if(primary)b.className='primary';b.onclick=fn;return b}function card(title,body){const c=document.createElement('section');c.className='card';c.innerHTML='<h2>'+esc(title)+'</h2>'+body;return c}function addActions(c,items){const row=document.createElement('div');row.className='row';items.forEach(([label,fn,primary])=>row.append(button(label,fn,primary)));c.append(row)}function render(){const root=$('#app');root.replaceChildren();const step=state.step;
if(step==='welcome'){let c=card('A little about you','<p>Start with a name and a few broad interests. You can pause at any point and begin an adventure before answering them all.</p><label for="name">What should HEART STONE call you?</label><input id="name" autocomplete="nickname" maxlength="60" value="'+esc(state.name)+'"><p class="muted">Your answers save on this device as you go.</p>');root.append(c);$('#name').oninput=e=>{state.name=e.target.value;save('Saved')};addActions(c,[['Getting to Know You',()=>go('interests'),true],['Set today’s limits',()=>go('limits')]]);}
if(step==='interests'){let answered=Object.keys(state.likes).length;let c=card('Getting to Know You','<p>What sounds like you today? You can change your mind after you try something.</p><p class="progress">'+answered+' of '+interests.length+' answered · Every answer saves</p>');root.append(c);interests.forEach((interest,i)=>{let d=document.createElement('div');d.className='card';d.innerHTML='<strong>'+esc(interest)+'</strong>';let row=document.createElement('div');row.className='row';[['I like it','like'],["I don’t like it",'dislike'],['Not sure','unsure'],['Skip','skip']].forEach(([label,value])=>{let b=button(label,()=>{state.likes[interest]=value;save('Saved');render()});if(state.likes[interest]===value)b.className='selected';row.append(b)});d.append(row);root.append(d)});addActions(c,[['Pause and return later',()=>go('paused')],['Set today’s limits',()=>go('limits'),true]]);}
if(step==='paused'){let c=card('Your place is saved','<p>Come back whenever you like. HEART STONE can already use the answers you chose.</p>');root.append(c);addActions(c,[['Continue getting to know me',()=>go('interests'),true],['Set today’s limits',()=>go('limits')]]);}
if(step==='limits'){let c=card('What works for you today?','<p>These choices are private and apply to this adventure search. No one has to explain a limit.</p><label><input type="checkbox" id="noWalking" style="width:auto;margin-right:9px">Avoid activities that require walking</label><label><input type="checkbox" id="freeOnly" style="width:auto;margin-right:9px">Show only free activities</label><label for="time">Time available today</label><select id="time" style="font:inherit;padding:10px;border-radius:8px;width:100%"><option value="45">Up to 45 minutes</option><option value="60">Up to 1 hour</option><option value="120">Up to 2 hours</option></select><p class="muted">If an adventure does not fit, HEART STONE will offer fewer choices rather than cross a limit.</p>');root.append(c);$('#noWalking').checked=state.limits.walking;$('#freeOnly').checked=state.limits.freeOnly;$('#time').value=String(state.limits.maxMinutes);function update(){state.limits={walking:$('#noWalking').checked,freeOnly:$('#freeOnly').checked,maxMinutes:Number($('#time').value)};state.page=0;save('Today’s limits saved')}['#noWalking','#freeOnly','#time'].forEach(id=>$(id).onchange=update);addActions(c,[['Review interests',()=>go('interests')],['Show fitting adventures',()=>{update();go('choices')},true]]);}
if(step==='choices'){let liked=Object.entries(state.likes).filter(([k,v])=>v==='like').map(([k])=>k);let eligible=adventures.filter(a=>!(state.limits.walking&&a.walking)&&!(state.limits.freeOnly&&!a.free)&&a.minutes<=state.limits.maxMinutes);let ordered=[...eligible].sort((a,b)=>b.tags.filter(x=>liked.includes(x)).length-a.tags.filter(x=>liked.includes(x)).length);let first=state.page*3;if(first>=ordered.length){state.page=0;first=0}let shown=ordered.slice(first,first+3);let c=card('Three ways to begin','<p>These are sample adventure ideas. Check the actual location, access, hours, cost, and safety before going. Your boundaries always come first.</p>');root.append(c);if(!shown.length){let note=document.createElement('p');note.textContent='No sample adventures fit these limits right now. Try a different time or return later; your limits will not be overridden.';c.append(note)}shown.forEach(a=>{let item=card(a.title,'<p>'+esc(a.description)+'</p><p><strong>Time:</strong> '+esc(a.time)+'<br><strong>Cost:</strong> '+esc(a.cost)+'</p><p class="muted">'+(a.tags.some(t=>liked.includes(t))?'Suggested because you like '+esc(a.tags.filter(t=>liked.includes(t)).join(' and '))+'.':'A chance to try something new.')+'</p>');addActions(item,[['Choose this adventure',()=>{state.choice=adventures.indexOf(a);go('active')},true]]);root.append(item)});addActions(c,[['Show me 3 more',()=>{state.page=state.page===0&&ordered.length>3?1:0;save();render()}],['Change today’s limits',()=>go('limits')],['Edit my interests',()=>go('interests')]]);}
if(step==='active'){let a=adventures[state.choice]||adventures[0];let c=card(a.title,'<p>'+esc(a.description)+'</p><p><strong>Your moment:</strong> '+esc(a.memory)+'</p><p class="muted">Pause or stop anytime. A photo is optional; safety and consent come first. This prototype does not verify a visit.</p>');root.append(c);addActions(c,[['Pause',()=>go('adventurePaused')],['Finish and reflect',()=>go('finish'),true]]);}
if(step==='adventurePaused'){let c=card('Adventure paused','<p>Pick up when you are ready.</p>');root.append(c);addActions(c,[['Resume',()=>go('active'),true],['Back to suggestions',()=>go('choices')]]);}
if(step==='finish'){let c=card('The memory is yours','<p>What would you like to remember? This note stays private in this browser.</p><label for="memory">My memory (optional)</label><textarea id="memory" rows="4"></textarea><label for="reflection">How did that feel for you? (optional)</label><textarea id="reflection" rows="3"></textarea><p class="muted">One experience does not permanently change your interests. You can review them whenever you like.</p>');root.append(c);$('#memory').value=state.memory;$('#reflection').value=state.reflection;$('#memory').oninput=e=>{state.memory=e.target.value;save('Private draft saved')};$('#reflection').oninput=e=>{state.reflection=e.target.value;save('Private draft saved')};addActions(c,[['Save private memory',()=>go('history'),true],['Pause',()=>go('finishPaused')]]);}
if(step==='finishPaused'){let c=card('Your draft is saved','<p>Your reflection and memory will be here when you return.</p>');root.append(c);addActions(c,[['Continue',()=>go('finish'),true]]);}
if(step==='history'){let c=card('Your first adventure memory','<p>'+esc(state.memory||'No note saved. The experience still counts.')+'</p><p><strong>Your reflection:</strong> '+esc(state.reflection||'Not answered')+'</p><p class="muted">Private on this device. HEART STONE would ask before using reflection to update a stated preference.</p>');root.append(c);addActions(c,[['Review interests',()=>go('interests')],['Explore another adventure',()=>{state.page=1-state.page;go('choices')},true]]);}
}render();</script></html>
