name: Date Quest regression checks

on:
  push:
    paths:
      - 'index.html'
      - 'date-home.js'
      - 'date-quest-membership.mjs'
      - 'tests/date-quest-membership.test.mjs'
      - 'account-wishes.js'
      - 'tests/account-wish-revocation.test.cjs'
      - 'moment-invitations.js'
      - 'invitation-opening.html'
      - 'test-account-calendar.cjs'
      - 'tests/moment-invitations.cjs'
      - 'tests/planner-drafts.test.cjs'
      - 'tests/session-recovery.test.cjs'
      - 'tests/heartstone-conversation.test.mjs'
      - 'supabase/functions/heartstone-conversation/handler.mjs'
      - '.github/workflows/date-quest-checks.yml'
  pull_request:
    paths:
      - 'index.html'
      - 'date-home.js'
      - 'date-quest-membership.mjs'
      - 'tests/date-quest-membership.test.mjs'
      - 'account-wishes.js'
      - 'tests/account-wish-revocation.test.cjs'
      - 'moment-invitations.js'
      - 'invitation-opening.html'
      - 'test-account-calendar.cjs'
      - 'tests/moment-invitations.cjs'
      - 'tests/planner-drafts.test.cjs'
      - 'tests/session-recovery.test.cjs'
      - 'tests/heartstone-conversation.test.mjs'
      - 'supabase/functions/heartstone-conversation/handler.mjs'
      - '.github/workflows/date-quest-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: date-quest-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    name: Calendar and invitations
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check private calendar behavior
        run: node test-account-calendar.cjs
      - name: Check invitation lifecycle
        run: node tests/moment-invitations.cjs
      - name: Check planner draft protection
        run: node --test tests/planner-drafts.test.cjs
      - name: Check sign-in and session recovery
        run: node --test tests/session-recovery.test.cjs
      - name: Check conversation privacy and usage limits
        run: node --test tests/heartstone-conversation.test.mjs
      - name: Check ended wish shares and fresh planning access
        run: node --test tests/account-wish-revocation.test.cjs
      - name: Check founding membership limits and lifetime pricing
        run: node --test tests/date-quest-membership.test.mjs
