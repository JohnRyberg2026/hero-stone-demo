name: Avatar application integration
on:
  push:
    branches: [codex/avatar-app-integration-20261026]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --prefix /tmp/integration-tools --no-package-lock playwright@1.61.1
      - name: Install headless Chromium
        timeout-minutes: 3
        run: /tmp/integration-tools/node_modules/.bin/playwright install --only-shell chromium
      - name: Check combined application and approved avatar
        env:
          NODE_PATH: /tmp/integration-tools/node_modules
        run: |
          python3 -m http.server 8765 > /tmp/integration-server.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8765/ > /dev/null; then break; fi
            sleep 1
          done
          node tools/check-date-release.cjs --browser
          node test-heart-stone-avatar-voice.cjs
          node test-heart-stone-avatar-motion.cjs
          node test-heart-stone-avatar-appearance.cjs
          node test-heart-stone-blink.cjs
          node test-heart-stone-blink-browser.cjs
          node test-heart-stone-speech-motion.cjs
          node test-heart-stone-speech-browser.cjs
          node tools/export-heartstone-facial.cjs --check
          SPEECH_DEVICE=1 node test-heart-stone-speech-browser.cjs
