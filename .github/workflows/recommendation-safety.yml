name: Recommendation safety checks
on:
  push:
    paths:
      - 'recommendation-safety.js'
      - 'recommendation-inputs.js'
      - 'test-recommendation-safety.cjs'
      - 'test-recommendation-inputs.cjs'
      - 'safe-adventure-discovery.js'
      - 'test-safe-adventure-discovery.cjs'
      - 'recommendation-profile-boundary.js'
      - 'test-recommendation-profile-boundary.cjs'
      - 'adventure-preferences-store.js'
      - 'test-adventure-preferences-store.cjs'
      - '.github/workflows/recommendation-safety.yml'
  pull_request:
    paths:
      - 'recommendation-safety.js'
      - 'recommendation-inputs.js'
      - 'test-recommendation-safety.cjs'
      - 'test-recommendation-inputs.cjs'
      - '.github/workflows/recommendation-safety.yml'
jobs:
  safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node test-recommendation-safety.cjs
      - run: node test-recommendation-inputs.cjs
      - run: node test-safe-adventure-discovery.cjs
      - run: node test-recommendation-profile-boundary.cjs
      - run: node test-adventure-preferences-store.cjs
