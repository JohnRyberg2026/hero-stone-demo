name: Recommendation safety checks
on:
  push:
    paths:
      - 'storybook-preview.html'
      - 'storybook-preview.js'
      - 'test-storybook-browser.cjs'
      - 'storybook-drafts.js'
      - 'test-storybook-drafts.cjs'
      - 'recommendation-safety.js'
      - 'recommendation-inputs.js'
      - 'test-recommendation-safety.cjs'
      - 'test-recommendation-inputs.cjs'
      - 'safe-adventure-discovery.js'
      - 'test-safe-adventure-discovery.cjs'
      - 'recommendation-profile-boundary.js'
      - 'test-recommendation-profile-boundary.cjs'
      - 'adventure-preferences-store.js'
      - 'test-adventure-preferences-store.cjs'
      - 'adventure-preferences-setup.js'
      - 'test-adventure-preferences-setup.cjs'
      - 'adventure-profile-flow.js'
      - 'test-adventure-profile-flow.cjs'
      - 'adventure-profile-view.js'
      - 'test-adventure-profile-view.cjs'
      - 'adventure-profile-preview.html'
      - 'test-adventure-profile-browser-load.cjs'
      - 'test-adventure-profile-browser.cjs'
      - '.github/workflows/recommendation-safety.yml'
  pull_request:
    paths:
      - 'storybook-preview.html'
      - 'storybook-preview.js'
      - 'test-storybook-browser.cjs'
      - 'storybook-drafts.js'
      - 'test-storybook-drafts.cjs'
      - 'recommendation-safety.js'
      - 'recommendation-inputs.js'
      - 'test-recommendation-safety.cjs'
      - 'test-recommendation-inputs.cjs'
      - 'adventure-profile-preview.html'
      - 'test-adventure-profile-browser-load.cjs'
      - 'test-adventure-profile-browser.cjs'
      - '.github/workflows/recommendation-safety.yml'
permissions:
  contents: read
jobs:
  safety:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: node test-storybook-drafts.cjs
      - run: node test-recommendation-safety.cjs
      - run: node test-recommendation-inputs.cjs
      - run: node test-safe-adventure-discovery.cjs
      - run: node test-recommendation-profile-boundary.cjs
      - run: node test-adventure-preferences-store.cjs
      - run: node test-adventure-preferences-setup.cjs
      - run: node test-adventure-profile-flow.cjs
      - run: node test-adventure-profile-view.cjs
      - run: node test-adventure-profile-browser-load.cjs
      - name: Install browser runtime
        run: |
          npm install --no-save --package-lock=false --ignore-scripts playwright@1.62.1
          npx playwright install --with-deps chromium
      - name: Browser profile isolation checks
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/profile-preview-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8765/adventure-profile-preview.html >/dev/null; then break; fi
            sleep 0.25
          done
          node test-adventure-profile-browser.cjs
          node test-storybook-browser.cjs
