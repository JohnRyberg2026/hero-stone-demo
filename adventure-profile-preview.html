<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Adventure Profile — Development Preview</title>
<style>body{font:16px system-ui,sans-serif;max-width:42rem;margin:2rem auto;padding:0 1rem;color:#252525}section{border:1px solid #aaa;border-radius:12px;padding:1.2rem}p{line-height:1.5}.note{font-size:.9rem;color:#555}button{padding:.6rem 1rem}</style></head>
<body><main><a href="heart-stone-welcome-preview.html">← Back to the HEART STONE welcome</a><h1>Adventure preferences</h1><p class="note">Development preview only. Reads only the signed-in account. No edits, invitations, purchases or sharing.</p><section aria-live="polite"><h2 id="statusHeading">Checking account</h2><p id="statusMessage">Confirming saved preferences…</p><p id="statusRevision"></p><button id="refresh" type="button">Refresh profile</button></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.8/dist/umd/supabase.js"></script>
<script src="adventure-preferences-store.js"></script><script src="adventure-preferences-setup.js"></script><script src="adventure-profile-flow.js"></script><script src="adventure-profile-view.js"></script>
<script>
'use strict';
(()=>{
 const heading=document.getElementById('statusHeading'),message=document.getElementById('statusMessage'),revision=document.getElementById('statusRevision');
 let epoch=0;
 const client=window.supabase?.createClient('https://iqxhqxlcraatdheslqeo.supabase.co','sb_publishable_SIhJh737mEWvvmOm_4zuSw_4jh_BU_h');
 function render(state){const m=AdventureProfileView.model(state);heading.textContent=m.screen==='saved'?'Saved preferences':m.screen==='sign_in'?'Sign in required':m.screen==='refresh'?'Refresh required':'Unavailable';message.textContent=m.message;revision.textContent=Number.isSafeInteger(m.revision)?'Saved revision: '+m.revision:'';}
 async function refresh(){const token=++epoch;heading.textContent='Checking account';message.textContent='Confirming saved preferences…';revision.textContent='';if(!client){render({state:'needs_confirmation'});return;}
  try{const state=await AdventureProfileFlow.load(client);if(token!==epoch)return;render(state);}catch{if(token===epoch)render({state:'needs_confirmation'});}
 }
 client?.auth?.onAuthStateChange(()=>{epoch++;render({state:'needs_confirmation'});setTimeout(refresh,0);});
 document.getElementById('refresh').addEventListener('click',refresh);refresh();
})();
</script></body></html>
