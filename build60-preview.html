<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#190a11">
  <title>HEART STONE™ — The Search for Connection™</title>
  <style>
    :root{--ink:#fff8ef;--muted:#dfd1c7;--wine:#35131f;--wine2:#4a2130;--night:#10070c;--gold:#e0aa42;--gold2:#f5d67c;--green:#55d6a0;--red:#ff7285;--line:#8e6833;--card:#25171b;--soft:#352a2d}
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:radial-gradient(circle at 50% -20%,#551c2c 0,#1b0b12 42%,#0e070a 100%);color:var(--ink);font:16px/1.45 Inter,system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh}
    button,input,select,textarea{font:inherit}.skip{position:absolute;left:-9999px}.skip:focus{left:12px;top:12px;z-index:30;background:#fff;color:#000;padding:8px}
    .shell{max-width:880px;margin:auto;padding:20px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}.brand{font-family:Georgia,serif;color:var(--gold2);font-weight:800;letter-spacing:.08em}.status{font-size:.78rem;color:var(--green)}
    .panel{background:linear-gradient(180deg,rgba(69,31,44,.97),rgba(28,17,21,.98));border:1px solid var(--line);border-radius:25px;padding:clamp(20px,5vw,42px);box-shadow:0 24px 80px #0008}.logo{width:150px;max-height:150px;object-fit:contain;display:block;margin:0 auto 8px}.crest{width:110px;height:110px;margin:0 auto 15px;border:3px solid var(--gold);border-radius:50%;display:grid;place-items:center;font:700 2.5rem Georgia;background:radial-gradient(circle,#613044,#170b12);box-shadow:0 0 35px #e0aa4240}
    h1,h2,h3{font-family:Georgia,serif;color:var(--gold2);line-height:1.08}h1{text-align:center;font-size:clamp(2rem,6vw,3.7rem);margin:.3em 0}h2{font-size:clamp(1.65rem,4vw,2.5rem);margin:.2em 0 .4em}h3{font-size:1.25rem;margin:1.2em 0 .4em}.lead{text-align:center;color:var(--muted);max-width:680px;margin:0 auto 24px}.eyebrow{text-transform:uppercase;color:var(--gold);letter-spacing:.18em;font-size:.73rem;font-weight:800}.promise{border:1px solid #826334;background:#1d1416;border-radius:16px;padding:15px;color:var(--muted);margin-top:18px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.grid.three{grid-template-columns:repeat(3,minmax(0,1fr))}@media(max-width:680px){.grid,.grid.three{grid-template-columns:1fr}.shell{padding:10px}.panel{border-radius:18px;padding:20px}.top{align-items:flex-start}}
    .btn{width:100%;border:1px solid #e8b64f;border-radius:14px;padding:14px 18px;margin:6px 0;background:linear-gradient(#e3ae48,#b8791f);color:#190d08;font-weight:900;cursor:pointer;box-shadow:inset 0 1px #fff8}.btn:hover{filter:brightness(1.08)}.btn:focus-visible,.choice:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #fff;outline-offset:3px}.btn.secondary{background:#302a2c;color:#fff;border-color:#74676b}.btn.ghost{background:transparent;color:var(--gold2);border-color:#80632f}.btn.danger{background:#481d28;color:#fff;border-color:#9b4559}.small{padding:9px 12px;font-size:.88rem;width:auto}
    label{display:block;font-weight:800;margin:13px 0 6px}input,select,textarea{width:100%;border:2px solid transparent;border-radius:12px;padding:13px;background:#fff;color:#201318}textarea{min-height:95px;resize:vertical}.help{font-size:.85rem;color:var(--muted)}.error{background:#5c1c2b;border:1px solid var(--red);padding:10px;border-radius:10px;margin:10px 0}.success{background:#123c31;border:1px solid var(--green);padding:10px;border-radius:10px}
    .progress{height:8px;background:#21171a;border-radius:20px;overflow:hidden;margin:10px 0 24px}.progress>i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--gold2));width:0}.choice{border:1px solid #705a4a;background:#302426;border-radius:14px;padding:14px;text-align:left;color:#fff;cursor:pointer;min-height:62px}.choice:hover{border-color:var(--gold)}.choice.selected{background:#5a3b24;border:2px solid var(--gold2)}.choice strong{display:block;color:var(--gold2);margin-bottom:3px}.chips{display:flex;flex-wrap:wrap;gap:9px}.chip{border:1px solid #755f50;border-radius:999px;padding:9px 13px;background:#2b2224;color:#fff;cursor:pointer}.chip.on{background:#80571f;border-color:var(--gold2)}
    .step-card,.summary-card,.world-card{border:1px solid #765d3c;border-radius:16px;padding:16px;background:#2b2023;margin:10px 0}.step-card{display:flex;justify-content:space-between;gap:10px}.badge{font-size:.72rem;text-transform:uppercase;border-radius:99px;padding:5px 9px;background:#22352f;color:var(--green);height:max-content}.world-card{position:relative;overflow:hidden}.world-card p{color:var(--muted)}.gateway-card{text-align:center}.gateway-card .logo{width:150px;height:150px;margin:0 auto 12px}.gateway-card h2{text-align:center;margin-top:0}.my-quest{display:grid;grid-template-columns:180px 1fr;gap:22px;align-items:center;border:1px solid #765d3c;border-radius:18px;background:linear-gradient(135deg,#2b2023,#21171a);padding:18px;margin-top:16px}.my-quest img{width:180px;height:180px;object-fit:contain;border-radius:50%}.my-quest h2{margin:0 0 5px}.my-quest textarea{min-height:72px}.my-quest .btn{margin-bottom:0}.quest-option{display:flex;flex-direction:column;min-height:245px}.quest-option .btn{margin-top:auto}.quest-meta{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0}.quest-meta span{background:#49362a;border:1px solid #795d36;border-radius:99px;padding:5px 9px;font-size:.76rem;color:var(--gold2)}.my-logo-small{width:120px;height:120px;object-fit:contain;display:block;margin:0 auto 10px}@media(max-width:680px){.my-quest{grid-template-columns:1fr;text-align:center}.my-quest img{margin:auto;width:150px;height:150px}}.world-icon{font-size:2.4rem}.notice{font-size:.82rem;color:#ffdf9f}.nav{display:flex;gap:10px;margin-top:20px}.nav>*{flex:1}.question-count{color:var(--gold);font-weight:800}.why{font-size:.85rem;color:var(--muted);border-left:3px solid var(--gold);padding-left:10px}.hidden{display:none!important}.footer{text-align:center;color:#a9959c;font-size:.75rem;margin:18px}.account-menu{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px}.account-menu button{width:auto}.answer-row{padding:12px 0;border-bottom:1px solid #57464a}.timer{font:800 1.5rem monospace;color:var(--gold2)}.envelope{font-size:6rem;text-align:center;cursor:pointer;filter:drop-shadow(0 10px 18px #000)}
  </style>
</head>
<body>
<a class="skip" href="#app">Skip to content</a>
<main id="app" class="shell" tabindex="-1" aria-live="polite"></main>
<script>
(() => {
  'use strict';
  const KEY='heartStoneBuild50';
  const $=s=>document.querySelector(s);
  const escapeHtml=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const blank={version:60,session:null,accounts:{},route:'welcome',setupStep:0,answers:{},profile:{},boundaries:{},bucket:[],compass:{},world:null,quest:null,myQuest:{},dateQuest:{},memories:[],storybook:{},storybookEditIndex:null};
  let state=load();
  function load(){try{return {...structuredClone(blank),...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch{return structuredClone(blank)}}
  function save(){localStorage.setItem(KEY,JSON.stringify(state));setStatus('Saved privately on this device')}
  function setStatus(t){const e=$('#saveStatus');if(e)e.textContent=t}
  async function hash(s){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
  function go(route){state.route=route;save();render();scrollTo({top:0,behavior:'smooth'})}
  function shell(body,{progress=null}={}){return `<div class="top"><div class="brand">HEART STONE™</div><div id="saveStatus" class="status">Saved</div>${state.session?`<button class="btn ghost small" data-go="account">My HEART STONE™</button>`:''}</div>${progress!==null?`<div class="progress" aria-label="Setup progress"><i style="width:${progress}%"></i></div>`:''}<section class="panel">${body}</section><div class="footer">Technology is the tool. Connection is the purpose. People are the heart.</div>`}
  function otherField(id,label='Other — Tell us in your own words'){return `<label for="${id}">${label}</label><textarea id="${id}" placeholder="Type your answer here"></textarea>`}
  const discovery=[
    ['greatDay','What sounds like a great day to you?','This helps HEART STONE™ understand what naturally brings you to life.',['Exploring outdoors','Great food or cooking','Arts, music or creativity','Learning something new','Relaxing and slowing down','Discovering somewhere new','Games and friendly competition','Helping someone','Spending time with animals','Connecting through conversation','Festivals and community events']],
    ['adventure','How adventurous do you feel?','Your answer shapes how far we move beyond the familiar.',['Keep it comfortable and familiar','Introduce me to something new','Surprise me within my boundaries','Challenge me gently','Push me carefully—but ask first','It depends on the day']],
    ['social','What social setting feels best?','We use this to match the scale of an experience.',['Time by myself','One person I trust','My partner','My immediate family','A few close friends','A small group','A community gathering','A large energetic event','It depends']],
    ['planning','How much planning do you prefer?','This guides the Surprise Engine™.',['Tell me everything in advance','Give me the important details','Give me a loose plan','Keep part of it a surprise','Surprise me within my boundaries','Let my partner or captain plan','Ask each time']],
    ['pace','What pace feels right?','Pace can always change with your current mood.',['Calm and restorative','Easygoing','Moderately active','Energetic','Physically challenging','A mixture','It depends on how I feel']],
    ['budget','What budget usually feels comfortable?','We never assume willingness to spend.',['Free experiences','Under $25','Under $50','Under $100','Special occasions can cost more','Always ask before spending','Prefer not to answer']],
    ['time','How much time do you normally have?','This helps us build something that fits real life.',['15–30 minutes','About an hour','Two to four hours','Half a day','Full day','Overnight','Weekend','My availability changes']],
    ['moreOf','What do you want more of in your life?','Choose the connection intentions that matter now.',['Connection','Romance','Laughter','Friendship','Family time','Confidence','Peace','Nature','Creativity','Learning','Movement','Community','Service','Adventure','Meaningful memories']],
    ['joyKillers','What tends to take the joy out of an experience?','Avoiding friction is part of personalization.',['Feeling rushed','Too much planning','Waiting around','Crowds','Noise','Cost uncertainty','Long drives','Physical exhaustion','Being photographed','Public attention','Competition','Unclear expectations','Last-minute changes','Feeling pressured']],
    ['firstHelp','What would you like HEART STONE™ to help you do first?','This helps us recommend the right doorway.',['Plan meaningful time with my partner','Bring my family closer','Create more fun with friends','Meet my community safely','Help my children explore and belong','Get outdoors more','Try something new','Complete a bucket-list experience','Make memories worth preserving','Surprise me']]
  ];
  const safety=['Walking and hiking','Swimming or boating','Heights or climbing','Uneven terrain','Crowded places','Loud environments','Remote locations','Activities after dark','Meeting new people','Public participation','Photography','Video recording','Precise location sharing','Unplanned spending','Surprise destinations','Deep personal questions'];
  const moods=['Relaxed','Playful','Flirty','Romantic','Sensual','Reflective','Social','Adventurous','Creative','Competitive','Tired','Stressed','Curious','Helpful','Quiet'];
  function render(){
    const views={welcome,auth,setup,profile,discoveryView,safetyView,bucketView,compassView,summary,dashboard,gateway,dateQuestHome,dateQuestAlign,dateQuestPartner,dateQuestShared,dateQuestInvitation,dateQuestPlay,myQuestDetails,myQuestChoices,worlds,worldHome,account,memoriesView,storybookView,storybookSettings,storybookEdit,questView,questComplete};
    $('#app').innerHTML=(views[state.route]||welcome)(); bind();
  }
  function welcome(){return shell(`<div class="crest" aria-hidden="true">♥</div><div class="eyebrow" style="text-align:center">THE SEARCH FOR CONNECTION™</div><h1>HEART STONE™</h1><p class="lead">One account connecting you to real people, real-world experiences, meaningful adventures and memories that belong to you.</p><button class="btn" data-go="auth" data-mode="create">CREATE A NEW ACCOUNT</button><button class="btn secondary" data-go="auth" data-mode="signin">SIGN IN</button>${state.session?`<button class="btn ghost" data-go="setup">CONTINUE SAVED SETUP</button>`:''}<div class="promise"><strong>Your life. Your boundaries. Your memories.</strong><br>Your preferences, photographs, stories and memories belong to you. You decide what stays private, what is shared and what becomes part of a Living Storybook™.</div>`)}
  function auth(){return shell(`<div class="eyebrow">Account Gateway</div><h2>${state.authMode==='signin'?'Welcome back':'Begin with HEART STONE™'}</h2><div class="grid"><button class="choice ${state.authMode!=='signin'?'selected':''}" data-mode="create"><strong>Create account</strong>Start a private member profile.</button><button class="choice ${state.authMode==='signin'?'selected':''}" data-mode="signin"><strong>Sign in</strong>Continue saved adventures.</button></div><form id="authForm"><label>Email address<input name="email" type="email" required autocomplete="email"></label><label>Password<input name="password" type="password" required minlength="8" autocomplete="${state.authMode==='signin'?'current-password':'new-password'}"></label>${state.authMode==='signin'?'':`<label>First or chosen name<input name="name" required autocomplete="given-name"></label><label>Age group<select name="age" required><option value="">Choose one</option><option>Under 13</option><option>13–15</option><option>16–17</option><option>18–24</option><option>25–39</option><option>40–54</option><option>55–69</option><option>70+</option></select></label><label>Country and region<input name="region" placeholder="Country, state/province or general area" required></label><label><input name="terms" type="checkbox" required style="width:auto"> I understand the privacy and ownership promise.</label>`}<div id="authError"></div><button class="btn" type="submit">${state.authMode==='signin'?'SIGN IN & CONTINUE':'CREATE MY HEART STONE™ ACCOUNT'}</button></form><button class="btn ghost" data-go="welcome">BACK</button>`)}
  function setup(){const done=[state.profile.saved,Object.keys(state.answers).length>=10,safety.every(x=>state.boundaries[x]),state.bucket.length>=3,!!state.compass.saved];const cards=['About You','What You Enjoy','Your Boundaries','Your Bucket List','Today’s Compass'];return shell(`<div class="eyebrow">Your Foundation</div><h2>Build Your HEART STONE™</h2><p>This is a beginning, not a permanent definition. You can change every answer later.</p>${cards.map((x,i)=>`<div class="step-card"><div><strong>${i+1}. ${x}</strong><div class="help">${done[i]?'Ready to review':'Continue when you are ready'}</div></div><span class="badge">${done[i]?'Complete':'In progress'}</span></div>`).join('')}<button class="btn" data-go="${!done[0]?'profile':!done[1]?'discoveryView':!done[2]?'safetyView':!done[3]?'bucketView':!done[4]?'compassView':'summary'}">CONTINUE SETUP</button><button class="btn secondary" data-go="gateway">CHOOSE AN EXPERIENCE NOW</button>`,{progress:done.filter(Boolean).length*20})}
  function dashboard(){const name=state.profile.display||state.profile.name||state.session?.name||'Explorer',moods=(state.compass.moods||[]).join(', ')||'Open to discovery',active=state.quest?`<div class="promise"><strong>You have a quest in progress.</strong><br>${escapeHtml(state.quest.title||state.quest.mode||'Your adventure is waiting.')}<button class="btn" data-go="questView">RESUME MY QUEST</button></div>`:'',recent=state.memories?.[0]?`<div class="summary-card"><div class="eyebrow">Latest saved memory</div><h3>${escapeHtml(state.memories[0].quest.title)}</h3><p>${escapeHtml(state.memories[0].reflection||state.memories[0].feeling)}</p><div class="help">${escapeHtml(state.memories[0].privacy)}</div></div>`:'';return shell(`<div class="eyebrow" style="text-align:center">YOUR HEART STONE™ HOME</div><h1>Welcome back, ${escapeHtml(name)}</h1><p class="lead">What kind of connection feels right today?</p>${active}<div class="summary-card"><strong>Today’s Compass</strong><p>${escapeHtml(moods)}</p><button class="btn ghost" data-go="compassView">CHANGE TODAY’S COMPASS</button></div><div class="grid"><button class="choice" data-go="gateway"><strong>CHOOSE AN EXPERIENCE</strong>Date Quest™, World Quest™ or My Quest™.</button><button class="choice" data-go="account"><strong>MY HEART STONE™</strong>Update your profile, answers, boundaries and bucket lists.</button></div><div class="grid"><button class="choice" data-go="bucketView"><strong>MY BUCKET LISTS</strong>Review dreams and add something new.</button><button class="choice" data-go="gateway"><strong>START SOMETHING NEW</strong>Let HEART STONE™ shape today’s path.</button></div>${recent}`)}
  function profile(){return shell(`<div class="eyebrow">Step 1 of 5</div><h2>Let’s begin with you</h2><p>We use this to personalize safely. Public display is always separate from private account information.</p><form id="profileForm"><label>First or chosen name<input name="name" required value="${escapeHtml(state.profile.name||state.session?.name||'')}"></label><label>Display name<input name="display" value="${escapeHtml(state.profile.display||'')}"></label><label>Home city or general area<input name="region" value="${escapeHtml(state.profile.region||state.session?.region||'')}"></label><label>Who do you usually adventure with?<select name="companions"><option>By myself</option><option>My spouse or partner</option><option>My children</option><option>My family</option><option>Friends</option><option>My community</option><option>I’m not sure yet</option><option>Other</option></select></label>${otherField('profileOther')}<label>Accessibility, dietary or safety information<textarea name="access" placeholder="You may also write None or Prefer not to answer">${escapeHtml(state.profile.access||'')}</textarea></label><label>Normal travel radius<select name="travel"><option>Within 5 miles</option><option>Within 15 miles</option><option>Within 30 miles</option><option>Within 60 miles</option><option>Day trips</option><option>Ask each time</option><option>Other</option></select></label><label>Starting privacy<select name="privacy"><option>Private by default</option><option>Shared with selected connections</option><option>Community participant</option><option>Other</option></select></label><button class="btn">SAVE MY BASIC PROFILE</button></form><button class="btn ghost" data-go="setup">BACK</button>`,{progress:20})}
  function discoveryView(){const i=Math.min(state.discoveryIndex||0,9),q=discovery[i],saved=state.answers[q[0]]||{};return shell(`<div class="question-count">Question ${i+1} of 10</div><h2>${q[1]}</h2><p class="why">Why are we asking? ${q[2]}</p><div class="grid">${q[3].map(o=>`<button class="choice answer ${saved.choices?.includes(o)?'selected':''}" data-value="${escapeHtml(o)}"><strong>${escapeHtml(o)}</strong></button>`).join('')}</div>${otherField('discoveryOther')}<div class="nav"><button class="btn secondary" data-discovery="back">BACK</button><button class="btn" data-discovery="next">${i===9?'FINISH':'CONTINUE'}</button></div><button class="btn ghost" data-go="setup">SAVE AND FINISH LATER</button>`,{progress:20+(i+1)*2})}
  function safetyView(){const i=Math.min(state.safetyIndex||0,safety.length-1),item=safety[i],v=state.boundaries[item];return shell(`<div class="question-count">Boundary ${i+1} of ${safety.length}</div><h2>Your Personal Safety Envelope</h2><p class="lead">How do you feel about <strong>${item}</strong>?</p><div class="grid three"><button class="choice boundary ${v==='YES'?'selected':''}" data-value="YES"><strong>YES</strong>Generally comfortable</button><button class="choice boundary ${v==='MAYBE'?'selected':''}" data-value="MAYBE"><strong>MAYBE</strong>Ask me first</button><button class="choice boundary ${v==='NO'?'selected':''}" data-value="NO"><strong>NO</strong>Do not include</button></div>${otherField('boundaryOther','Other — Add private context in your own words')}<p class="promise">You never have to explain a No. For shared experiences, the lowest comfort level wins.</p><div class="nav"><button class="btn secondary" data-safety="back">BACK</button><button class="btn" data-safety="next">${i===safety.length-1?'PROTECT THESE BOUNDARIES':'CONTINUE'}</button></div>`,{progress:60})}
  function bucketView(){return shell(`<div class="eyebrow">Step 4 of 5</div><h2>Plant your first dreams</h2><p>Some dreams are enormous. Others may be waiting just down the road.</p><form id="bucketForm"><label>Something nearby<textarea name="nearby" required placeholder="A place close to home you would love to explore">${escapeHtml(state.bucket[0]?.text||'')}</textarea></label><label>Something to learn or try<textarea name="learn" required placeholder="A skill, activity or experience">${escapeHtml(state.bucket[1]?.text||'')}</textarea></label><label>Something meaningful to share<textarea name="share" required placeholder="A memory you would love to create with someone">${escapeHtml(state.bucket[2]?.text||'')}</textarea></label>${otherField('bucketOther','Other — Add another dream in your own words')}<label>Default privacy<select name="privacy"><option>Private to me</option><option>Shared with selected connections</option><option>Available for matching</option><option>Community dream</option><option>Other</option></select></label><button class="btn">SAVE MY STARTER BUCKET LIST</button></form>`,{progress:80})}
  function compassView(){return shell(`<div class="eyebrow">Step 5 of 5</div><h2>How do you feel today?</h2><p>People are fluid. Today’s Compass changes the adventure without changing who you are.</p><div class="chips" id="moods">${moods.map(m=>`<button class="chip ${state.compass.moods?.includes(m)?'on':''}" data-mood="${m}">${m}</button>`).join('')}</div>${otherField('moodOther')}<form id="compassForm"><label>Who would you like to connect with today?<select name="with"><option>Myself</option><option>My partner</option><option>My child or children</option><option>My family</option><option>Friends</option><option>My community</option><option>I have not decided</option><option>Other</option></select></label><label>Where would you like to be?<select name="setting"><option>At home</option><option>Close to home</option><option>Outdoors</option><option>Near the water</option><option>Around town</option><option>Somewhere new</option><option>Let HEART STONE™ suggest</option><option>Other</option></select></label><label>Time available<select name="time"><option>15–30 minutes</option><option>About an hour</option><option>Two to four hours</option><option>Full day</option><option>Planning for another day</option><option>Other</option></select></label><label>Today’s limits<textarea name="limits" placeholder="Budget, travel, energy, privacy or anything else"></textarea></label><label>Keep these settings for<select name="duration"><option>This adventure</option><option>Today</option><option>This week</option><option>Until I change them</option><option>Other</option></select></label><button class="btn">SET TODAY’S COMPASS</button></form>`,{progress:100})}
  function summary(){const top=Object.values(state.answers).flatMap(x=>x.choices||[]).slice(0,5);return shell(`<div class="eyebrow">Your foundation is ready</div><h2>Your HEART STONE™ is beginning to understand you</h2><div class="summary-card"><h3>What brings you to life</h3><p>${escapeHtml(top.join(', ')||'Still discovering')}</p></div><div class="summary-card"><h3>Today’s Compass</h3><p>${escapeHtml((state.compass.moods||[]).join(', ')||'Not set')} · ${escapeHtml(state.compass.with||'')}</p></div><div class="summary-card"><h3>Your Safety Envelope</h3><p>${Object.values(state.boundaries).filter(x=>x==='NO').length} protected No settings · ${Object.values(state.boundaries).filter(x=>x==='MAYBE').length} ask-first settings</p></div><div class="summary-card"><h3>Your first dreams</h3><p>${state.bucket.map(x=>escapeHtml(x.text)).join(' · ')||'Ready to begin'}</p></div><button class="btn" data-go="gateway">CONFIRM MY FOUNDATION</button><button class="btn secondary" data-go="setup">REVIEW MY ANSWERS</button>${otherField('summaryOther','Other — Tell HEART STONE™ what is missing')}`)}
  function gateway(){return shell(`<div class="eyebrow" style="text-align:center">Your HEART STONE™ is ready</div><h1>Where would you like connection to begin?</h1><div class="grid"><article class="world-card gateway-card"><img class="logo" src="images/official-logo.png" alt="DATE QUEST logo" onerror="this.style.display='none'"><h2>DATE QUEST™</h2><p>The app that turns time together into real connection™.</p><p class="notice">For verified adult couples. DATE QUEST™ is not a dating app.</p><button class="btn" data-date>ENTER DATE QUEST™</button></article><article class="world-card gateway-card"><img class="logo" src="images/world-choice-logo.png" alt="WORLD QUEST logo" onerror="this.style.display='none'"><h2>WORLD QUEST™</h2><p>Your city is the game board. The world is the community. HEART STONE™ is the referee.</p><button class="btn" data-go="worlds">ENTER WORLD QUEST™</button></article></div><button class="btn ghost" data-go="compassView">CHANGE TODAY’S COMPASS</button><section class="my-quest"><img src="images/my-quest-logo.png" alt="MY QUEST single-player logo" onerror="this.style.display='none'"><div><div class="eyebrow">A path shaped around you</div><h2>MY QUEST™</h2><p><strong>Not sure where to begin?</strong><br>Tell HEART STONE™ what you feel like doing, who you are with and how much time you have.</p><label for="myQuestText">Describe what you want to experience</label><textarea id="myQuestText" placeholder="For example: I want a quiet beach evening with my wife, close to home."></textarea><button class="btn" data-myquest>HELP ME CHOOSE</button><div id="myQuestResult" aria-live="polite"></div></div></section>`)}
  function myQuestDetails(){const m=state.myQuest||{};return shell(`<img class="my-logo-small" src="images/my-quest-logo.png" alt="MY QUEST logo"><div class="eyebrow" style="text-align:center">MY QUEST™ · YOUR CURRENT MOMENT</div><h1>Let’s shape this around you</h1><p class="lead">Your profile and boundaries still guide every suggestion. These answers only describe what fits right now.</p><div class="summary-card"><strong>You told HEART STONE™</strong><p>${escapeHtml(m.request||'')}</p></div><form id="myQuestDetailsForm"><label>Who is this experience for?<select name="with"><option>Just me</option><option>Me and my partner</option><option>Me and my child or children</option><option>Me and my family</option><option>Me and friends</option><option>Someone else</option><option>Other</option></select></label><label>How much time do you have?<select name="time"><option>15–30 minutes</option><option>About an hour</option><option>Two to four hours</option><option>Half a day</option><option>Full day</option><option>Planning for another day</option><option>Other</option></select></label><label>Where should it happen?<select name="setting"><option>At home</option><option>Close to home</option><option>Outdoors</option><option>Near the water</option><option>Around town</option><option>Somewhere new</option><option>Surprise me within my boundaries</option><option>Other</option></select></label><label>Budget for this quest<select name="budget"><option>Free</option><option>Under $25</option><option>Under $50</option><option>Under $100</option><option>Ask me before any spending</option><option>Other</option></select></label><label>Energy level right now<select name="energy"><option>Very low — keep it restful</option><option>Easygoing</option><option>Moderately active</option><option>Energetic</option><option>Surprise me within my boundaries</option><option>Other</option></select></label>${otherField('myQuestOther','Other — Add anything HEART STONE™ should understand')}<button class="btn">SHOW ME THREE QUESTS</button></form><button class="btn ghost" data-go="dashboard">RETURN TO HOME</button>`)}
  function buildMyQuestOptions(){const m=state.myQuest||{},s=`${m.request||''} ${m.other||''}`.toLowerCase(),water=/beach|water|ocean|river|lake|sunset/.test(s),food=/food|eat|restaurant|cook|meal|coffee/.test(s),quiet=/quiet|relax|peace|rest|slow/.test(s),creative=/art|music|creative|write|photo/.test(s),near=/home|close|near/.test(s);let pool=water?[["The Water’s Edge Reset","Go to a safe nearby waterfront, take a slow walk and find three details you normally miss.","FIND"],["Sunset Time Capsule","Choose one waterfront view, pause without screens, then record one thought you want to remember.","COMPLETE"],["Shoreline Curiosity Quest","Follow the safest public shoreline path and photograph three natural patterns without disturbing them.","GO"]]:food?[["The Local Flavor Find","Choose a locally owned place or ingredient you have never tried and learn its story.","FIND"],["Memory on a Plate","Make or order something tied to a good memory, then write down why it matters.","DO"],["Three-Taste Adventure","Create a tiny tasting flight using three affordable flavors you would not normally combine.","CREATE"]]:creative?[["Color Hunt","Find five colors around you and turn them into one photograph, sketch or short description.","FIND"],["Soundtrack of Today","Choose three songs that match your current mood and take a short screen-free walk with them.","CREATE"],["One-Page Story","Go somewhere comfortable and write one page beginning with: Today I noticed…","CREATE"]]:quiet?[["The Twenty-Minute Reset","Choose a safe comfortable place, silence notifications and notice five things with each sense.","DO"],["A Familiar Place, Seen Differently","Visit a nearby place you know well and discover one detail you have never noticed.","FIND"],["Permission to Pause","Make a favorite drink, choose one peaceful view and give yourself an unhurried half hour.","DO"]]:[["The Nearby Discovery","Visit a safe public place within your chosen radius that you have passed but never explored.","GO"],["The Curiosity Trail","Pick a direction or local landmark and find three things that make you want to know more.","FIND"],["A Small Act of Connection","Do one thoughtful, pressure-free thing that brightens your day or someone else’s.","DO"]];const alternates=[["The Five-Senses Trail","Take a safe walk and find one memorable thing for each of your five senses.","FIND"],["The $10 Discovery","Within your budget, find one small local experience you have never tried before.","GO"],["Future-Me Favor","Complete one enjoyable action today that your future self will genuinely appreciate.","DO"]];if(Number(m.refresh||0)%2)pool=alternates;if(near)pool=pool.map(x=>[x[0],x[1].replace('nearby ','nearby '),x[2]]);return pool.map((x,i)=>({id:`mq${m.refresh||0}-${i+1}`,title:x[0],description:x[1],type:x[2],time:m.time||'Flexible',cost:m.budget||'Your chosen budget'}))}
  function myQuestChoices(){const m=state.myQuest||{},options=m.options?.length?m.options:buildMyQuestOptions();state.myQuest.options=options;save();return shell(`<img class="my-logo-small" src="images/my-quest-logo.png" alt="MY QUEST logo"><div class="eyebrow" style="text-align:center">MY QUEST™ · THREE PATHS</div><h1>Which one feels right today?</h1><p class="lead">Each choice respects your saved boundaries and today’s limits. Nothing is locked until you choose.</p><div class="grid three">${options.map((o,i)=>`<article class="world-card quest-option"><div class="eyebrow">Option ${i+1} · ${escapeHtml(o.type)}</div><h3>${escapeHtml(o.title)}</h3><p>${escapeHtml(o.description)}</p><div class="quest-meta"><span>${escapeHtml(o.time)}</span><span>${escapeHtml(o.cost)}</span></div><button class="btn" data-pick-myquest="${i}">CHOOSE THIS QUEST</button></article>`).join('')}</div><button class="btn secondary" data-more-myquests>SHOW ME THREE DIFFERENT QUESTS</button>${otherField('customMyQuest','Other — Describe a different quest in your own words')}<button class="btn" data-custom-myquest>BUILD MY OTHER IDEA</button><button class="btn ghost" data-go="myQuestDetails">CHANGE MY DETAILS</button><button class="btn ghost" data-go="dashboard">RETURN TO HOME</button>`)}
  function worlds(){const w=[['kids','🧭','KIDS WORLD™','Safe, parent-managed adventures where children explore, learn, help and belong.'],['family','🏡','FAMILY WORLD™','Multi-generational adventures for children, parents, grandparents and extended family.'],['friends','🤝','FRIENDS WORLD™','Private adventures for friends, couples and invited teams.'],['community','🌍','COMMUNITY WORLD™','Verified local and worldwide adventures connecting neighbors, organizations and communities.']];return shell(`<div class="eyebrow" style="text-align:center">WORLD QUEST™</div><h1>Choose Your World</h1><p class="lead">Choose the world that fits who you want to explore with today. You can return whenever you wish.</p><div class="grid">${w.map(x=>`<article class="world-card"><div class="world-icon">${x[1]}</div><h2>${x[2]}</h2><p>${x[3]}</p><button class="btn" data-world="${x[0]}">ENTER ${x[2]}</button></article>`).join('')}</div><button class="btn ghost" data-go="compassView">CHANGE TODAY’S COMPASS</button>${otherField('worldOther','Other — Tell HEART STONE™ what you are looking for')}`)}
  function worldHome(){const names={kids:'KIDS WORLD™',family:'FAMILY WORLD™',friends:'FRIENDS WORLD™',community:'COMMUNITY WORLD™'};return shell(`<div class="eyebrow">WORLD QUEST™</div><h1>${names[state.world]||'WORLD QUEST™'}</h1>${state.world==='kids'?'<div class="promise"><strong>Protected youth area:</strong> A connected parent or guardian must approve youth participation. This prototype does not complete identity verification.</div>':''}<p class="lead">Current Compass: ${escapeHtml((state.compass.moods||[]).join(', ')||'Open to discovery')}</p><div class="grid"><button class="choice" data-start="individual"><strong>PLAY AS AN INDIVIDUAL</strong>Enter on your own.</button><button class="choice" data-start="couple"><strong>PLAY AS A COUPLE</strong>One shared adventure.</button><button class="choice" data-start="team"><strong>CREATE A TEAM</strong>Become captain and invite others.</button><button class="choice" data-start="join"><strong>JOIN A TEAM</strong>Use an invitation code.</button></div>${otherField('playOther','Other — Tell us how you want to play')}<button class="btn ghost" data-go="worlds">CHOOSE ANOTHER WORLD</button>`)}
  function account(){return shell(`<div class="eyebrow">Private member control center</div><h2>My HEART STONE™</h2><div class="account-menu"><button class="btn small" data-go="compassView">Current Compass</button><button class="btn small secondary" data-go="profile">Profile</button><button class="btn small secondary" data-go="discoveryView">Questions</button><button class="btn small secondary" data-go="safetyView">Boundaries</button><button class="btn small secondary" data-go="bucketView">Bucket Lists</button><button class="btn small secondary" data-go="memoriesView">My Memories</button><button class="btn small secondary" data-go="storybookView">Living Storybook™</button></div><h3>What HEART STONE™ understands</h3>${Object.entries(state.answers).map(([k,v])=>`<div class="answer-row"><strong>${escapeHtml(k)}</strong><div class="help">${escapeHtml((v.choices||[]).join(', '))}${v.other?' · '+escapeHtml(v.other):''}</div></div>`).join('')||'<p>No discovery answers yet.</p>'}<button class="btn" data-go="gateway">CHOOSE AN EXPERIENCE</button><button class="btn ghost" data-go="dashboard">RETURN TO HOME</button><button class="btn secondary" data-signout>SIGN OUT</button><button class="btn danger" data-reset>RESET THIS LOCAL PROTOTYPE</button>`)}
  function memoriesView(){const memories=state.memories||[];return shell(`<div class="eyebrow" style="text-align:center">PRIVATE MEMORY LIBRARY</div><h1>My Memories</h1><p class="lead">These moments belong to you. You control what remains private, what is considered for a Living Storybook™, and what is removed.</p>${memories.length?memories.map((m,i)=>`<article class="summary-card"><div class="eyebrow">${escapeHtml(new Date(m.completed).toLocaleDateString())} · ${escapeHtml(m.quest.world==='my'?'MY QUEST™':'WORLD QUEST™')}</div><h3>${escapeHtml(m.quest.title)}</h3><p>${escapeHtml(m.reflection||m.feeling||'A completed adventure.')}</p>${m.other?`<p class="help">${escapeHtml(m.other)}</p>`:''}<div class="quest-meta"><span>${escapeHtml(m.feeling)}</span><span>${escapeHtml(m.privacy)}</span>${m.photoName?`<span>Photo: ${escapeHtml(m.photoName)}</span>`:''}${m.storybook?'<span>Living Storybook™</span>':''}</div><button class="btn ghost" data-storybook-memory="${i}">${m.storybook?'REMOVE FROM STORYBOOK CONSIDERATION':'CONSIDER FOR MY LIVING STORYBOOK™'}</button><button class="btn danger" data-delete-memory="${i}">DELETE THIS MEMORY</button></article>`).join(''):'<div class="promise"><strong>Your memory library is waiting.</strong><br>Complete a quest and choose to save the moment. It will appear here privately.</div>'}<button class="btn" data-go="storybookView">OPEN MY LIVING STORYBOOK™</button><button class="btn secondary" data-go="gateway">BEGIN A NEW EXPERIENCE</button><button class="btn ghost" data-go="dashboard">RETURN TO HOME</button>`)}
  function storyDraft(m,name){if(m.chapterText)return m.chapterText;const date=new Date(m.completed).toLocaleDateString(undefined,{year:'numeric',month:'long',day:'numeric'}),reflection=m.reflection||m.other||'';return reflection?`On ${date}, ${name} completed “${m.quest.title}.” ${reflection}`:`On ${date}, ${name} made time for “${m.quest.title}.” The experience was remembered as ${String(m.feeling||'meaningful').toLowerCase()}—a small piece of a life still being lived and a story still being written.`}
  function storybookView(){const name=state.profile.display||state.profile.name||state.session?.name||'My',book=state.storybook||{},defaultTitle=`${name}${name.toLowerCase().endsWith('s')?'’':'’s'} Living Storybook™`,selected=(state.memories||[]).map((memory,index)=>({memory,index})).filter(x=>x.memory.storybook);return shell(`<div class="eyebrow" style="text-align:center">PRIVATE LIVING STORYBOOK™ PREVIEW</div><h1>${escapeHtml(book.title||defaultTitle)}</h1><p class="lead">${escapeHtml(book.subtitle||'One life. Many moments. A story that still belongs to you.')}</p>${book.dedication?`<div class="summary-card" style="text-align:center"><div class="eyebrow">DEDICATION</div><p><em>${escapeHtml(book.dedication)}</em></p></div>`:''}<div class="promise"><strong>You remain the editor.</strong><br>HEART STONE™ may help shape the draft, but your words are final. Nothing is shared, published or added automatically.</div><button class="btn ghost" data-go="storybookSettings">CUSTOMIZE MY STORYBOOK™</button>${selected.length?`<div class="eyebrow" style="text-align:center">HEART STONE™ DRAFT · ${selected.length} ${selected.length===1?'CHAPTER':'CHAPTERS'}</div>${selected.map(({memory:m,index},chapter)=>`<article class="summary-card"><div class="eyebrow">CHAPTER ${chapter+1} · ${escapeHtml(new Date(m.completed).toLocaleDateString())}</div><h2>${escapeHtml(m.chapterTitle||m.quest.title)}</h2><p>${escapeHtml(storyDraft(m,name))}</p><div class="quest-meta"><span>${escapeHtml(m.feeling)}</span><span>${escapeHtml(m.privacy)}</span>${m.chapterEdited?'<span>Edited by you</span>':''}${m.photoName?`<span>Photo saved on this device</span>`:''}</div><button class="btn" data-edit-storybook="${index}">EDIT THIS CHAPTER</button><button class="btn ghost" data-storybook-memory="${index}">REMOVE THIS CHAPTER</button></article>`).join('')}<button class="btn" data-print-storybook>PRINT OR SAVE MY PRIVATE DRAFT</button>`:'<div class="summary-card"><h2>Your first chapter is waiting.</h2><p>Open My Memories and deliberately choose the moments you want HEART STONE™ to shape into your private story.</p></div>'}<button class="btn secondary" data-go="memoriesView">MANAGE MY MEMORIES</button><button class="btn ghost" data-go="dashboard">RETURN TO HOME</button>`)}
  function storybookSettings(){const name=state.profile.display||state.profile.name||state.session?.name||'My',book=state.storybook||{},defaultTitle=`${name}${name.toLowerCase().endsWith('s')?'’':'’s'} Living Storybook™`;return shell(`<div class="eyebrow" style="text-align:center">LIVING STORYBOOK™ · BOOK EDITOR</div><h1>Make the book yours.</h1><p class="lead">Choose the words that will welcome you—and the people you may someday invite—into your story.</p><form id="storybookSettingsForm"><label>Book title<input name="title" required value="${escapeHtml(book.title||defaultTitle)}"></label><label>Subtitle<input name="subtitle" required value="${escapeHtml(book.subtitle||'One life. Many moments. A story that still belongs to you.')}"></label><label>Private dedication<textarea name="dedication" placeholder="For someone, somewhere or something that gives this story meaning">${escapeHtml(book.dedication||'')}</textarea></label><label>Other — Add a private note about this book<textarea name="note" placeholder="What do you hope this Living Storybook™ will preserve?">${escapeHtml(book.note||'')}</textarea></label><div class="promise"><strong>This remains your private working copy.</strong><br>You decide later whether any finished edition is shared, exported or printed.</div><button class="btn">SAVE MY BOOK</button></form><button class="btn secondary" data-go="storybookView">CANCEL AND RETURN TO STORYBOOK</button><button class="btn ghost" data-go="dashboard">RETURN TO HOME</button>`)}
  function storybookEdit(){const i=Number(state.storybookEditIndex),m=state.memories?.[i],name=state.profile.display||state.profile.name||state.session?.name||'You';if(!m)return storybookView();return shell(`<div class="eyebrow" style="text-align:center">LIVING STORYBOOK™ · CHAPTER EDITOR</div><h1>Your words are final.</h1><p class="lead">HEART STONE™ created a starting draft. Keep it, rewrite it or make it entirely your own.</p><form id="storybookEditForm"><label>Chapter title<input name="title" required value="${escapeHtml(m.chapterTitle||m.quest.title)}"></label><label>Your chapter<textarea name="text" required>${escapeHtml(storyDraft(m,name))}</textarea></label><label>Other — Add a private editor’s note<textarea name="note" placeholder="A detail, context or reminder that does not need to appear in the chapter">${escapeHtml(m.chapterNote||'')}</textarea></label><div class="promise"><strong>You remain the author and editor.</strong><br>Saving changes updates only this private prototype on this device.</div><button class="btn">SAVE MY CHAPTER</button></form><button class="btn secondary" data-go="storybookView">CANCEL AND RETURN TO STORYBOOK</button><button class="btn ghost" data-go="dashboard">RETURN TO HOME</button>`)}
  function dateQuestHome(){const d=state.dateQuest||{},connected=!!d.partnerName,you=!!d.alignment,them=!!d.partnerAlignment,chosen=!!d.selectedDate;return shell(`<div class="eyebrow" style="text-align:center">DATE QUEST™ · PARTNER CONNECTION</div><h1>Two hearts. One shared compass.</h1><p class="lead">DATE QUEST™ helps verified adult couples plan meaningful time together. It is not a dating app and never matches strangers.</p>${connected?`<div class="summary-card"><div class="eyebrow">PRIVATE COUPLE SPACE</div><h2>${escapeHtml(state.profile.display||state.profile.name||state.session?.name||'You')} + ${escapeHtml(d.partnerName)}</h2><p>${escapeHtml(d.relationship||'Partners')} · Connection saved on this device</p><div class="quest-meta"><span>You: ${you?'ready':'waiting'}</span><span>${escapeHtml(d.partnerName)}: ${them?'ready':'waiting'}</span></div></div>${chosen?`<div class="promise"><strong>Your sealed DATE QUEST™ is waiting.</strong><br>${escapeHtml(d.selectedDate.title)}</div><button class="btn" data-go="dateQuestInvitation">OPEN OUR SEALED INVITATION</button>`:!you?'<button class="btn" data-go="dateQuestAlign">COMPLETE MY LOVE COMPASS™</button>':!them?`<button class="btn" data-go="dateQuestPartner">LET ${escapeHtml(d.partnerName).toUpperCase()} ANSWER PRIVATELY</button>`:'<button class="btn" data-go="dateQuestShared">REVEAL OUR SHARED COMPASS™</button>'}${you?'<button class="btn secondary" data-go="dateQuestAlign">UPDATE MY ANSWERS</button>':''}<button class="btn secondary" data-edit-partner>UPDATE PARTNER CONNECTION</button>`:`<form id="datePartnerForm"><label>Partner’s first or chosen name<input name="partnerName" required placeholder="Who will share this DATE QUEST™?"></label><label>How do you describe your relationship?<select name="relationship"><option>Spouse</option><option>Partner</option><option>Fiancé or fiancée</option><option>Long-term companion</option><option>Other</option></select></label><label>Prototype invite code<input name="inviteCode" value="DQ-${String(Date.now()).slice(-6)}" readonly></label><p class="help">For this prototype, connecting a partner is simulated on this device. No invitation is sent and no personal information leaves this browser.</p><label>Other — Add a private note<textarea name="other" placeholder="Anything HEART STONE™ should understand about planning together"></textarea></label><label><input name="confirm" type="checkbox" required style="width:auto"> We are both adults and understand DATE QUEST™ is for an existing couple.</label><button class="btn">CREATE OUR PRIVATE COUPLE SPACE</button></form>`}<div class="promise"><strong>Consent stays individual.</strong><br>Each partner’s boundaries remain private. Shared suggestions use the safer, lower limit; either person may pause or leave.</div><button class="btn ghost" data-go="gateway">BACK TO EXPERIENCE CHOICES</button><button class="btn ghost" data-go="dashboard">RETURN TO HOME</button>`)}
  function compassForm(id,title,intro,a={}){return `<div class="eyebrow" style="text-align:center">DATE QUEST™ · PRIVATE LOVE COMPASS™</div><h1>${escapeHtml(title)}</h1><p class="lead">${escapeHtml(intro)}</p><form id="${id}"><label>Connection energy<select name="energy">${['Quiet and close','Playful and light','Romantic','Adventurous together','Talk and reconnect','Other'].map(x=>`<option ${a.energy===x?'selected':''}>${x}</option>`).join('')}</select></label><label>Time available<select name="time">${['15–30 minutes','About an hour','Two to four hours','Half a day','Other'].map(x=>`<option ${a.time===x?'selected':''}>${x}</option>`).join('')}</select></label><label>Spending limit<select name="budget">${['Free','Under $25','Under $50','Under $100','Ask us before spending','Other'].map(x=>`<option ${a.budget===x?'selected':''}>${x}</option>`).join('')}</select></label><label>Surprise level<select name="surprise">${['Tell us the full plan','Keep one part a surprise','Surprise us within our boundaries','Ask us each time','Other'].map(x=>`<option ${a.surprise===x?'selected':''}>${x}</option>`).join('')}</select></label><label>Other — Describe what you hope to feel together<textarea name="other" placeholder="Use your own words">${escapeHtml(a.other||'')}</textarea></label><div class="promise"><strong>This side stays private.</strong><br>HEART STONE™ uses it to find overlap without exposing either person’s private wording.</div><button class="btn">SAVE THIS PRIVATE SIDE</button></form><button class="btn secondary" data-go="dateQuestHome">BACK TO OUR COUPLE SPACE</button><button class="btn ghost" data-go="dashboard">RETURN TO HOME</button>`}

  function sharedCompass(){const d=state.dateQuest||{},you=d.alignment||{},them=d.partnerAlignment||{},lower=(key,vals)=>{const a=vals.indexOf(you[key]),b=vals.indexOf(them[key]);return vals[Math.max(0,Math.min(a<0?0:a,b<0?0:b))]},time=lower('time',['15–30 minutes','About an hour','Two to four hours','Half a day']),budget=lower('budget',['Free','Under $25','Under $50','Under $100']),surprise=lower('surprise',['Tell us the full plan','Keep one part a surprise','Surprise us within our boundaries']),energy=you.energy===them.energy?you.energy:'Gentle shared connection';return {energy,time,budget,surprise}}
  const dateIdeas=[[['THE LITTLE THINGS DATE','Take a slow walk together and each point out three small things you appreciate but usually overlook.'],['OUR FAVORITE SONGS','Choose two meaningful songs, listen without other screens and share one memory each song brings back.'],['SUNSET PROMISE','Find a comfortable place to watch the sky change and each name one thing you want more of together.']],[['KITCHEN MEMORY DATE','Make a simple favorite snack together and trade stories about meals you remember from earlier in life.'],['NEIGHBORHOOD DISCOVERY WALK','Choose one nearby street you rarely explore and find three details that make it feel unique.'],['TWENTY QUESTIONS RECONNECTED','Put the phones away and take turns asking playful questions you have never asked—or have not asked in years.']]];
  function selectedDate(){const d=state.dateQuest?.selectedDate||{},flat=dateIdeas.flat(),match=flat.find(x=>x[0].toLowerCase()===String(d.title||'').toLowerCase());return {...d,title:d.title||match?.[0]||'Our DATE QUEST',description:d.description||match?.[1]||'Make protected time to reconnect together.',shared:d.shared||sharedCompass()}}
  function dateQuestShared(){const d=state.dateQuest||{},s=sharedCompass(),ideas=dateIdeas[Number(d.refresh||0)%dateIdeas.length];return shell(`<div class="eyebrow" style="text-align:center">YOU · THEM · US</div><h1>Your shared compass is ready.</h1><p class="lead">Private answers stay private. HEART STONE™ reveals only the safe overlap that belongs to both of you.</p><div class="summary-card"><div class="eyebrow">US · TODAY’S SHARED FIT</div><h2>${escapeHtml(s.energy)}</h2><div class="quest-meta"><span>${escapeHtml(s.time)}</span><span>${escapeHtml(s.budget)}</span><span>${escapeHtml(s.surprise)}</span></div></div><div class="grid three">${ideas.map((x,i)=>`<article class="world-card quest-option"><div class="eyebrow">DATE QUEST ${i+1}</div><h3>${x[0]}</h3><p>${x[1]}</p><div class="quest-meta"><span>${escapeHtml(s.time)}</span><span>${escapeHtml(s.budget)}</span></div><button class="btn" data-date-idea="${i}">CHOOSE THIS DATE</button></article>`).join('')}</div><button class="btn secondary" data-refresh-dates>SHOW US THREE DIFFERENT DATES</button><div class="promise"><strong>The lowest cap won.</strong><br>These choices follow the more cautious shared time, spending and surprise limits. Either partner may still say no or change course.</div><button class="btn ghost" data-go="dateQuestHome">BACK TO OUR COUPLE SPACE</button><button class="btn ghost" data-go="dashboard">RETURN TO HOME</button>`)}
  function dateQuestInvitation(){const q=selectedDate(),d=state.dateQuest||{},s=q.shared||{};return shell(`<div class="eyebrow" style="text-align:center">PRIVATE DATE QUEST™ · SEALED FOR TWO</div><h1>Open when you are together.</h1><p class="lead">For ${escapeHtml(state.profile.display||state.profile.name||state.session?.name||'You')} + ${escapeHtml(d.partnerName||'Your Partner')}</p><div class="envelope" data-open-date aria-label="Break the seal on your date invitation">💌</div><div class="summary-card" style="text-align:center"><div class="eyebrow">THE INVITATION REMAINS SEALED</div><h2>${escapeHtml(q.title)}</h2><div class="quest-meta" style="justify-content:center"><span>${escapeHtml(s.time||'Your shared time')}</span><span>${escapeHtml(s.budget||'Your shared budget')}</span><span>${escapeHtml(s.surprise||'Your shared plan')}</span></div></div><button class="btn" data-open-date>BREAK THE SEAL TOGETHER</button><div class="promise"><strong>Either heart may pause.</strong><br>Opening this invitation is not a commitment. You may change the plan, choose another date or leave at any time.</div><button class="btn secondary" data-go="dateQuestShared">CHOOSE ANOTHER DATE</button><button class="btn ghost" data-go="dateQuestHome">BACK TO OUR COUPLE SPACE</button><button class="btn ghost" data-go="dashboard">RETURN TO HOME</button>`)}
  function dateQuestPlay(){const q=selectedDate(),s=q.shared||{};return shell(`<div class="eyebrow" style="text-align:center">DATE QUEST™ · FOR THE TWO OF YOU</div><h1>${escapeHtml(q.title)}</h1><p class="lead">${escapeHtml(q.description)}</p><div class="summary-card"><div class="eyebrow">YOUR GENTLE PLAN</div><h3>1. Arrive together</h3><p>Put other screens away when it feels comfortable. Take one slow breath and notice that you chose this time for each other.</p><h3>2. Follow the invitation</h3><p>${escapeHtml(q.description)}</p><h3>3. Close with one sentence</h3><p>Before you finish, each say: “One thing I want to remember from this is…”</p></div><div class="quest-meta"><span>${escapeHtml(s.time||'Flexible time')}</span><span>${escapeHtml(s.budget||'Shared budget')}</span><span>No proof required</span></div><div class="promise"><strong>App time ends here. Your time together begins.</strong><br>Completion is personal. Nothing is photographed, shared or published automatically.</div><button class="btn" data-complete-date>WE COMPLETED OUR DATE QUEST™</button><button class="btn secondary" data-go="dateQuestShared">CHANGE OUR DATE</button><button class="btn ghost" data-go="dateQuestHome">PAUSE & RETURN TO OUR COUPLE SPACE</button><button class="btn ghost" data-go="dashboard">RETURN TO HOME</button>`)}
  function questView(){const q=state.quest||{},isMy=q.world==='my';if(q.phase==='envelope')return shell(`${isMy?'<img class="my-logo-small" src="images/my-quest-logo.png" alt="MY QUEST logo">':''}<div class="eyebrow" style="text-align:center">HEART STONE™ has shaped your ${isMy?'personal quest':'adventure'}</div><h1>Your ${isMy?'MY QUEST':'First Envelope'} Is Waiting</h1><p class="lead">The details remain sealed until you are ready to begin.</p><div class="envelope" data-open aria-label="Open sealed challenge">✉️</div><button class="btn" data-open>BREAK THE SEAL</button>${isMy?'<button class="btn ghost" data-go="gateway">RETURN TO HOME</button>':''}`);if(q.phase==='active')return shell(`<div class="eyebrow">${isMy?'MY QUEST™ · '+escapeHtml(q.type||'DO'):'Challenge 1 of 3 · FIND'}</div><div class="timer" id="timer">${isMy?'60:00':'20:00'}</div><h2>${escapeHtml(isMy?q.title:'Find Your City’s Symbol')}</h2><p>${escapeHtml(isMy?q.description:'Find a public symbol, emblem or landmark connected to your city. Capture your team safely recreating its shape or pose.')}</p><div class="summary-card"><strong>Your current limits</strong><p>${escapeHtml(isMy?`${state.myQuest.time||'Flexible time'} · ${state.myQuest.budget||'Chosen budget'} · ${state.myQuest.energy||'Comfortable pace'}`:'Follow your team’s shared boundaries.')}</p></div><div class="promise">${isMy?'You are always free to pause, change or leave this quest. Completion is personal; proof is optional.':'Photo evidence is optional in this rebuilt prototype. Never upload or publish another person without their permission.'}</div><button class="btn" data-complete>COMPLETE ${isMy?'MY QUEST':'TEST CHALLENGE'}</button><button class="btn secondary" data-skip>CHOOSE ANOTHER QUEST</button>${isMy?'<button class="btn ghost" data-go="gateway">RETURN TO HOME</button>':''}`);return shell(`<h1>${isMy?'Your MY QUEST Is Ready':'Adventure Ready'}</h1><p class="lead">${isMy?escapeHtml(q.title):`Your ${escapeHtml(q.mode||'World Quest')} adventure is ready.`}</p><button class="btn" data-begin>START THE QUEST</button><button class="btn ghost" data-go="${isMy?'myQuestChoices':'worldHome'}">BACK</button>${isMy?'<button class="btn ghost" data-go="gateway">RETURN TO HOME</button>':''}`)}
  function questComplete(){const q=state.quest||{};return shell(`<div class="eyebrow" style="text-align:center">QUEST COMPLETE · YOUR MEMORY</div><h1>You did it.</h1><p class="lead">${escapeHtml(q.title||'Your adventure')} is complete. The experience belongs to you; saving the memory is always your choice.</p><form id="memoryForm"><label>How did this experience feel?<select name="feeling"><option>Meaningful</option><option>Joyful</option><option>Peaceful</option><option>Playful</option><option>Challenging in a good way</option><option>Not what I expected</option><option>I would rather not say</option><option>Other</option></select></label><label>What would you like to remember?<textarea name="reflection" placeholder="A moment, thought, feeling or detail you do not want to lose"></textarea></label><label>Optional photo<input name="photo" type="file" accept="image/*"></label><p class="help">Prototype note: the photo stays on this device and is not uploaded publicly.</p><label>Who may see this memory?<select name="privacy"><option>Private to me</option><option>Shared with selected connections</option><option>Shared with the people on this quest</option><option>Eligible for my Living Storybook™</option><option>Do not save this memory</option><option>Other</option></select></label>${otherField('memoryOther','Other — Add anything else in your own words')}<label><input name="storybook" type="checkbox" style="width:auto"> Consider this memory for my private Living Storybook™</label><button class="btn">SAVE MEMORY & RETURN HOME</button></form><button class="btn secondary" data-finish-no-save>FINISH WITHOUT SAVING</button><button class="btn ghost" data-go="dashboard">RETURN TO HOME</button>`)}
  function bind(){
    document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{if(b.dataset.mode)state.authMode=b.dataset.mode;const home=b.textContent.trim()==='RETURN TO HOME';if(home&&state.route==='questComplete')state.quest=null;go(home?'dashboard':b.dataset.go)});
    document.querySelectorAll('[data-mode]:not([data-go])').forEach(b=>b.onclick=()=>{state.authMode=b.dataset.mode;save();render()});
    const af=$('#authForm');if(af)af.onsubmit=async e=>{e.preventDefault();const f=new FormData(af),email=String(f.get('email')).toLowerCase().trim(),pw=String(f.get('password')),err=$('#authError');if(state.authMode==='signin'){const a=state.accounts[email];if(!a||a.passwordHash!==await hash(pw)){err.innerHTML='<div class="error">Account not found or password incorrect.</div>';return}state.session={email,name:a.name,region:a.region};go(a.onboarded?'dashboard':'setup')}else{if(state.accounts[email]){err.innerHTML='<div class="error">That email already has a local prototype account. Please sign in.</div>';return}const name=String(f.get('name')),age=String(f.get('age')),region=String(f.get('region'));state.accounts[email]={name,age,region,passwordHash:await hash(pw),onboarded:false};state.session={email,name,region};state.profile={name,region,age};go(age.includes('Under')||age.includes('13–')||age.includes('16–')?'profile':'profile')}};
    const pf=$('#profileForm');if(pf)pf.onsubmit=e=>{e.preventDefault();const f=Object.fromEntries(new FormData(pf));state.profile={...state.profile,...f,other:$('#profileOther').value,saved:true};go('discoveryView')};
    document.querySelectorAll('.answer').forEach(b=>b.onclick=()=>b.classList.toggle('selected'));
    document.querySelectorAll('[data-discovery]').forEach(b=>b.onclick=()=>{let i=state.discoveryIndex||0;if(b.dataset.discovery==='back'){state.discoveryIndex=Math.max(0,i-1);save();render();return}const q=discovery[i];state.answers[q[0]]={choices:[...document.querySelectorAll('.answer.selected')].map(x=>x.dataset.value),other:$('#discoveryOther').value,updated:new Date().toISOString()};if(i===9){state.discoveryIndex=0;go('safetyView')}else{state.discoveryIndex=i+1;save();render()}});
    document.querySelectorAll('.boundary').forEach(b=>b.onclick=()=>{document.querySelectorAll('.boundary').forEach(x=>x.classList.remove('selected'));b.classList.add('selected')});
    document.querySelectorAll('[data-safety]').forEach(b=>b.onclick=()=>{let i=state.safetyIndex||0;if(b.dataset.safety==='back'){state.safetyIndex=Math.max(0,i-1);save();render();return}const sel=$('.boundary.selected');if(!sel){alert('Choose Yes, Maybe or No before continuing.');return}state.boundaries[safety[i]]=sel.dataset.value;const note=$('#boundaryOther').value;if(note)state.boundaries[safety[i]+' note']=note;if(i===safety.length-1){state.safetyIndex=0;go('bucketView')}else{state.safetyIndex=i+1;save();render()}});
    const bf=$('#bucketForm');if(bf)bf.onsubmit=e=>{e.preventDefault();const f=new FormData(bf),privacy=f.get('privacy');state.bucket=[{type:'nearby',text:f.get('nearby'),privacy},{type:'learn',text:f.get('learn'),privacy},{type:'share',text:f.get('share'),privacy}];if($('#bucketOther').value)state.bucket.push({type:'other',text:$('#bucketOther').value,privacy});go('compassView')};
    document.querySelectorAll('[data-mood]').forEach(b=>b.onclick=()=>b.classList.toggle('on'));
    const cf=$('#compassForm');if(cf)cf.onsubmit=e=>{e.preventDefault();const f=Object.fromEntries(new FormData(cf));state.compass={...f,moods:[...document.querySelectorAll('.chip.on')].map(x=>x.dataset.mood),other:$('#moodOther').value,saved:true,updated:new Date().toISOString()};if(state.session&&state.accounts[state.session.email])state.accounts[state.session.email].onboarded=true;go('summary')};
    document.querySelectorAll('[data-world]').forEach(b=>b.onclick=()=>{state.world=b.dataset.world;go('worldHome')});
    document.querySelectorAll('[data-start]').forEach(b=>{b.onclick=()=>{state.quest={phase:'ready',mode:b.dataset.start,world:state.world};go('questView')}});
    const date=$('[data-date]');if(date)date.onclick=()=>go('dateQuestHome');
    const datePartnerForm=$('#datePartnerForm');if(datePartnerForm)datePartnerForm.onsubmit=e=>{e.preventDefault();const f=new FormData(datePartnerForm);state.dateQuest={...state.dateQuest,partnerName:String(f.get('partnerName')||'').trim(),relationship:String(f.get('relationship')||''),inviteCode:String(f.get('inviteCode')||''),other:String(f.get('other')||'').trim(),connected:new Date().toISOString()};go('dateQuestHome')};
    const editPartner=$('[data-edit-partner]');if(editPartner)editPartner.onclick=()=>{state.dateQuest={};save();render()};
    const dateAlignForm=$('#dateAlignForm');if(dateAlignForm)dateAlignForm.onsubmit=e=>{e.preventDefault();const f=Object.fromEntries(new FormData(dateAlignForm));state.dateQuest={...state.dateQuest,alignment:{...f,saved:new Date().toISOString()}};go('dateQuestHome')};
    const datePartnerAlignForm=$('#datePartnerAlignForm');if(datePartnerAlignForm)datePartnerAlignForm.onsubmit=e=>{e.preventDefault();const f=Object.fromEntries(new FormData(datePartnerAlignForm));state.dateQuest={...state.dateQuest,partnerAlignment:{...f,saved:new Date().toISOString()}};go('dateQuestHome')};
    document.querySelectorAll('[data-date-idea]').forEach(b=>b.onclick=()=>{const group=Number(state.dateQuest.refresh||0)%dateIdeas.length,idea=dateIdeas[group][Number(b.dataset.dateIdea)];state.dateQuest.selectedDate={index:Number(b.dataset.dateIdea),group,title:idea[0],description:idea[1],shared:sharedCompass(),phase:'sealed',chosen:new Date().toISOString()};go('dateQuestInvitation')});
    const refreshDates=$('[data-refresh-dates]');if(refreshDates)refreshDates.onclick=()=>{state.dateQuest.refresh=Number(state.dateQuest.refresh||0)+1;save();render()};
    document.querySelectorAll('[data-open-date]').forEach(b=>b.onclick=()=>{state.dateQuest.selectedDate={...selectedDate(),phase:'active',opened:new Date().toISOString()};go('dateQuestPlay')});
    const completeDate=$('[data-complete-date]');if(completeDate)completeDate.onclick=()=>{const q=selectedDate();state.dateQuest.selectedDate={...q,phase:'complete',completed:new Date().toISOString()};state.quest={world:'date',mode:'couple',phase:'complete',title:q.title,description:q.description,completed:new Date().toISOString()};go('questComplete')};
    const myQuest=$('[data-myquest]');if(myQuest)myQuest.onclick=()=>{const text=$('#myQuestText').value.trim(),out=$('#myQuestResult');if(!text){out.innerHTML='<div class="error">Tell HEART STONE™ a little about what you want today.</div>';return}state.myQuest={request:text,created:new Date().toISOString()};state.compass.myQuest=text;go('myQuestDetails')};
    const mqf=$('#myQuestDetailsForm');if(mqf)mqf.onsubmit=e=>{e.preventDefault();const f=Object.fromEntries(new FormData(mqf));state.myQuest={...state.myQuest,...f,other:$('#myQuestOther').value,options:[]};go('myQuestChoices')};
    document.querySelectorAll('[data-pick-myquest]').forEach(b=>b.onclick=()=>{const o=(state.myQuest.options||[])[Number(b.dataset.pickMyquest)];if(!o)return;state.myQuest.selected=o;state.quest={phase:'ready',world:'my',mode:'individual',...o};go('questView')});
    const more=$('[data-more-myquests]');if(more)more.onclick=()=>{state.myQuest.refresh=Number(state.myQuest.refresh||0)+1;state.myQuest.options=[];save();render()};
    const custom=$('[data-custom-myquest]');if(custom)custom.onclick=()=>{const text=$('#customMyQuest').value.trim();if(!text){alert('Describe your Other idea first.');return}const o={id:`custom${Date.now()}`,title:'My Other Quest',description:text,type:'MY IDEA',time:state.myQuest.time||'Flexible',cost:state.myQuest.budget||'Your chosen budget'};state.myQuest.selected=o;state.quest={phase:'ready',world:'my',mode:'individual',...o};go('questView')};
    const begin=$('[data-begin]');if(begin)begin.onclick=()=>{state.quest.phase='envelope';go('questView')};
    document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{state.quest.phase='active';state.quest.started=Date.now();save();render();startTimer()});
    const complete=$('[data-complete]');if(complete)complete.onclick=()=>{state.quest={...state.quest,phase:'complete',completed:new Date().toISOString()};go('questComplete')};
    const mf=$('#memoryForm');if(mf)mf.onsubmit=e=>{e.preventDefault();const f=new FormData(mf),photo=f.get('photo'),wasDate=state.quest?.world==='date';state.memories=state.memories||[];state.memories.unshift({id:`memory${Date.now()}`,quest:{title:state.quest?.title||'Completed Quest',description:state.quest?.description||'',world:state.quest?.world||''},feeling:String(f.get('feeling')||''),reflection:String(f.get('reflection')||''),privacy:String(f.get('privacy')||''),other:$('#memoryOther').value,storybook:f.get('storybook')==='on',photoName:photo&&photo.name?photo.name:'',completed:state.quest?.completed||new Date().toISOString()});state.quest=null;if(wasDate)state.dateQuest.selectedDate=null;go('dashboard')};
    const noSave=$('[data-finish-no-save]');if(noSave)noSave.onclick=()=>{const wasDate=state.quest?.world==='date';state.quest=null;if(wasDate)state.dateQuest.selectedDate=null;go('dashboard')};
    document.querySelectorAll('[data-storybook-memory]').forEach(b=>b.onclick=()=>{const m=state.memories?.[Number(b.dataset.storybookMemory)];if(!m)return;m.storybook=!m.storybook;save();render()});
    document.querySelectorAll('[data-edit-storybook]').forEach(b=>b.onclick=()=>{state.storybookEditIndex=Number(b.dataset.editStorybook);go('storybookEdit')});
    const storybookSettingsForm=$('#storybookSettingsForm');if(storybookSettingsForm)storybookSettingsForm.onsubmit=e=>{e.preventDefault();const f=new FormData(storybookSettingsForm);state.storybook={title:String(f.get('title')||'').trim(),subtitle:String(f.get('subtitle')||'').trim(),dedication:String(f.get('dedication')||'').trim(),note:String(f.get('note')||'').trim(),updated:new Date().toISOString()};go('storybookView')};
    const storybookForm=$('#storybookEditForm');if(storybookForm)storybookForm.onsubmit=e=>{e.preventDefault();const m=state.memories?.[Number(state.storybookEditIndex)];if(!m)return;const f=new FormData(storybookForm);m.chapterTitle=String(f.get('title')||'').trim();m.chapterText=String(f.get('text')||'').trim();m.chapterNote=String(f.get('note')||'').trim();m.chapterEdited=true;m.chapterUpdated=new Date().toISOString();go('storybookView')};
    const printStorybook=$('[data-print-storybook]');if(printStorybook)printStorybook.onclick=()=>window.print();
    document.querySelectorAll('[data-delete-memory]').forEach(b=>b.onclick=()=>{const i=Number(b.dataset.deleteMemory),m=state.memories?.[i];if(m&&confirm(`Delete “${m.quest.title}” from your private memories? This cannot be undone in this prototype.`)){state.memories.splice(i,1);save();render()}});
    const skip=$('[data-skip]');if(skip)skip.onclick=()=>{const isMy=state.quest?.world==='my';if(confirm(isMy?'Leave this quest and choose another?':'Skip this challenge with no points?')){state.quest=null;go(isMy?'myQuestChoices':'gateway')}};
    const signout=$('[data-signout]');if(signout)signout.onclick=()=>{state.session=null;go('welcome')};
    const reset=$('[data-reset]');if(reset)reset.onclick=()=>{if(confirm('Delete this device’s prototype account, answers and progress?')){localStorage.removeItem(KEY);state=structuredClone(blank);render()}};
    if(state.route==='questView'&&state.quest?.phase==='active')startTimer();
  }
  function startTimer(){const el=$('#timer');if(!el)return;const total=state.quest?.world==='my'?3600:1200;const tick=()=>{const left=Math.max(0,total-Math.floor((Date.now()-(state.quest.started||Date.now()))/1000));el.textContent=`${String(Math.floor(left/60)).padStart(2,'0')}:${String(left%60).padStart(2,'0')}`};tick();setInterval(tick,1000)}
  render();
})();
</script>
